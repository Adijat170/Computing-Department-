
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Department of Computing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Contact Us</h1>
    <p>Lens Polytechnic Offa</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="programmes.html">Programmes</a>
    <a href="contact.html">Contact Us</a>
</nav>

<main>
    <section class="hero">
        <h2>Get in Touch</h2>
        <p>
            Do you have questions about the Department of Computing?
            Use the contact form below to prepare your enquiry.
        </p>
    </section>

    <section>
        <h2>Send Us a Message</h2>

        <form action="#" method="post">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your full name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email address" required>

            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject"
                   placeholder="Enter the subject" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="6"
                      placeholder="Type your message here"
                      required></textarea>

            <button type="submit">Submit Message</button>
        </form>
    </section>
</main>

<footer>
    <p>&copy; 2026 Lens Polytechnic Offa - Department of Computing</p>
</footer>

</body>
</html>
